name: mention
on:
  workflow_dispatch:
    inputs:
      issue:
        description: The issue to mention the owner on (a new one makes a new, unread thread)
        default: "8"
permissions:
  issues: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue || '8' }}
        run: gh issue comment "$ISSUE" --body "@gold-silver-copper a notification for ghtui's inbox check ($(date +%s))"
